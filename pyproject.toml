[project]
name = "sentinelx-ai"
version = "0.1.0"
description = "An Intelligent AI-powered Intrusion Detection, Prevention and Learning Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
    { name = "Hamidou Tatou (Hami-Tat)" }
]

keywords = [
    "cybersecurity",
    "ids",
    "ips",
    "machine-learning",
    "intrusion-detection",
    "network-security",
    "ai",
    "python"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License"
]

dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "psycopg2-binary",
    "pydantic",
    "scikit-learn",
    "numpy",
    "pandas",
    "scapy",
    "joblib"
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pre-commit",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B"
]

ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true
source = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/sentinelx_ai"]